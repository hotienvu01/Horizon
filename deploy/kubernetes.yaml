apiVersion: v1
kind: Namespace
metadata:
  name: horizon
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: horizon-data
  namespace: horizon
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: horizon
  namespace: horizon
spec:
  schedule: "0 8 * * *"
  timeZone: Asia/Bangkok
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          imagePullSecrets:
            - name: nexus-regcred
          containers:
            - name: horizon
              image: HORIZON_IMAGE
              command: ["/app/.venv/bin/horizon"]
              args: ["--hours", "24"]
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
              envFrom:
                - secretRef:
                    name: horizon-ai
                    optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: config
                  mountPath: /app/data/config.json
                  subPath: config.json
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: horizon-data
            - name: config
              configMap:
                name: horizon-config
